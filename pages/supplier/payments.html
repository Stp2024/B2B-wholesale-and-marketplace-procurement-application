<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=dashboard.html#payments" />
    <title>Redirecting to Payments & Invoices - Supplier Workspace</title>
    <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="../../css/supplier/dashboard.css" />
    <script>
      window.location.replace("dashboard.html#payments");
    </script>
    <style>
      body {
        font-family: 'Inter', -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f7f4f2;
        color: #292625;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }
      .redirect-card {
        background: #ffffff;
        border: 1px solid #e4ddd8;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      }
      .redirect-spinner {
        font-size: 2rem;
        margin-bottom: 12px;
      }
      .redirect-title {
        font-size: 1.15rem;
        font-weight: 700;
        margin: 0 0 8px 0;
        color: #292625;
      }
      .redirect-desc {
        font-size: 0.9rem;
        color: #746d69;
        margin: 0 0 20px 0;
        line-height: 1.5;
      }
      .tn-back-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 18px;
        background: #7a5c52;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s ease, transform 0.15s ease;
      }
      .tn-back-button:hover {
        background: #644a42;
        transform: translateY(-1px);
      }
      .tn-back-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="redirect-card">
      <div class="redirect-spinner">⏳</div>
      <h1 class="redirect-title">Opening Payments & Invoices</h1>
      <p class="redirect-desc">Loading Supplier Workspace... If not redirected automatically, <a href="dashboard.html#payments" style="color: #7a5c52; font-weight: 600;">click here</a>.</p>
      <button class="tn-back-button" type="button" onclick="if(window.history.length > 1){window.history.back();}else{window.location.href='dashboard.html';}" aria-label="Go back">
        <span class="tn-back-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </span>
        <span>Back</span>
      </button>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer RFQs</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
      <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
  </head>
  <body data-page="rfqs">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>RFQ Management</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <form id="rfq-form">
            <div class="form-grid">
              <div class="field">
                <label for="rfq-title">RFQ title</label>
                <input id="rfq-title" name="title" type="text" required />
              </div>
              <div class="field">
                <label for="rfq-product">Product</label>
                <select id="rfq-product" name="productId" required></select>
              </div>
              <div class="field">
                <label for="rfq-actual-price">
                  Actual Price
                  <span style="font-size:0.75rem;font-weight:400;color:#64748b;margin-left:4px">(auto-filled, not editable)</span>
                </label>
                <div style="position:relative">
                  <input
                    id="rfq-actual-price"
                    type="text"
                    readonly
                    placeholder="Select a product first"
                    style="background:#f1f5f9;cursor:not-allowed;color:#334155;font-weight:600;padding-right:2.5rem;"
                  />
                  <span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:0.78rem;color:#94a3b8;pointer-events:none"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                </div>
              </div>
              <div class="field">
                <label for="rfq-supplier">Supplier</label>
                <select id="rfq-supplier" name="supplierId" required></select>
              </div>
              <div class="field">
                <label for="rfq-quantity">Required quantity</label>
                <input
                  id="rfq-quantity"
                  name="quantity"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <div class="field">
                <label for="rfq-unit">Unit</label>
                <input
                  id="rfq-unit"
                  name="unit"
                  type="text"
                  value="units"
                  required
                />
              </div>
              <div class="field">
                <label for="rfq-target-price">Target price</label>
                <input
                  id="rfq-target-price"
                  name="targetPrice"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <div class="field">
                <label for="rfq-location">Delivery location</label>
                <input
                  id="rfq-location"
                  name="deliveryLocation"
                  type="text"
                  value="Bengaluru"
                  required
                />
              </div>
              <div class="field">
                <label for="rfq-date">Expected date</label>
                <input id="rfq-date" name="expectedDate" type="date" required />
              </div>
              <div class="field">
                <label for="rfq-response-deadline">Response deadline</label>
                <input
                  id="rfq-response-deadline"
                  name="responseDeadline"
                  type="date"
                  required
                />
              </div>
              <div class="field" style="grid-column: 1 / -1">
                <label for="rfq-notes">Additional requirements</label>
                <textarea id="rfq-notes" name="notes"></textarea>
              </div>
            </div>
            <div class="button-row" style="margin-top: 18px">
              <button class="btn btn-primary" type="submit">Save RFQ</button>
              <button class="btn btn-secondary" type="reset">Clear</button>
            </div>
          </form>
        </section>

        <section class="page-panel">
          <h2>My RFQs</h2>
          <div id="rfq-list" class="record-grid"></div>
        </section>
      </main>
    </div>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

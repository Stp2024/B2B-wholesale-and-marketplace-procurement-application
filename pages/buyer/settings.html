<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Settings</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
</head>
  <body data-page="settings">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Buyer Settings</h1>
          </div>
        </header>

        <section class="page-panel">
          <form id="buyer-settings-form">
            <div class="setting-list">
              <label class="checkbox-field">
                <span>Email order alerts</span>
                <input type="checkbox" name="emailAlerts" />
              </label>
              <label class="checkbox-field">
                <span>Push/app notifications</span>
                <input type="checkbox" name="appNotifications" />
              </label>
              <label class="checkbox-field">
                <span>Order status updates</span>
                <input type="checkbox" name="orderUpdates" />
              </label>
              <label class="checkbox-field">
                <span>Price alerts</span>
                <input type="checkbox" name="priceAlerts" />
              </label>
              <label class="checkbox-field">
                <span>Supplier updates</span>
                <input type="checkbox" name="supplierUpdates" />
              </label>
              <label class="checkbox-field">
                <span>Newsletter emails</span>
                <input type="checkbox" name="newsletterEmails" />
              </label>
              <label class="checkbox-field">
                <span>Auto-save quote drafts</span>
                <input type="checkbox" name="autoSaveDrafts" />
              </label>
            </div>

            <div class="form-grid" style="margin-top:24px;">
              <div class="field">
                <label for="profilePrivacy">Profile visibility</label>
                <select id="profilePrivacy" name="profilePrivacy">
                  <option value="Private to my account">Private to my account</option>
                  <option value="Visible to verified suppliers">Visible to verified suppliers</option>
                  <option value="Public to all buyers">Public to all buyers</option>
                </select>
              </div>
              <div class="field">
                <label for="theme">Theme</label>
                <select id="theme" name="theme">
                  <option value="Light">Light</option>
                  <option value="Dark">Dark</option>
                  <option value="System default">System default</option>
                </select>
              </div>
            </div>

            <div class="button-row" style="margin-top:20px;">
              <button class="btn btn-primary" type="submit">Save Settings</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

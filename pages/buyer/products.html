<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Products</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
      <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
  </head>
  <body data-page="products">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Product Discovery</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <div class="filter-grid">
            <div class="field">
              <label for="product-search">Search</label>
              <input
                id="product-search"
                type="search"
                placeholder="Search by product or supplier"
              />
            </div>
            <div class="field">
              <label for="product-category">Category</label>
              <select id="product-category"></select>
            </div>
            <div class="field">
              <label for="product-supplier">Supplier</label>
              <select id="product-supplier"></select>
            </div>
            <div class="field">
              <label for="product-availability">Availability</label>
              <select id="product-availability">
                <option value="">All</option>
                <option value="In Stock">In Stock</option>
                <option value="Low Stock">Low Stock</option>
              </select>
            </div>
            <div class="field">
              <label for="product-sort">Sort</label>
              <select id="product-sort">
                <option value="name">Name</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button class="btn btn-primary" type="button" id="product-reset">
                Reset Filters
              </button>
            </div>
          </div>
        </section>

        <section>
          <div id="product-list" class="card-grid"></div>
        </section>
      </main>
    </div>
    <script src="../../js/product-service.js"></script>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

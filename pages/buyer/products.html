<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Products</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css" />
  </head>
  <body data-page="products">
    <div class="module-shell">
      <aside class="module-sidebar buyer-sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html" class="brand-logo" aria-label="Buyer dashboard home">
            <img src="../../images/TradeNest.webp" alt="TradeNest" class="dashboard-brand-image" />
          </a>
          <span class="brand-subtitle">Buyer Workspace</span>
        </div>
        <nav class="sidebar-nav" aria-label="Buyer navigation">
          <a href="dashboard.html">📊 Dashboard</a>
          <a href="products.html" class="active">🛍️ Products</a>
          <a href="suppliers.html">🏢 Suppliers</a>
          <a href="saved-products.html">💾 Saved Products</a>
          <a href="saved-suppliers.html">📁 Saved Suppliers</a>
          <a href="profile.html">👤 Profile</a>
          <a href="settings.html">⚙️ Settings</a>
          <a href="rfqs.html">📝 RFQs</a>
          <a href="quotations.html">💬 Quotations</a>
          <a href="compare-quotes.html">⚖️ Compare</a>
          <a href="samples.html">🧪 Samples</a>
          <a href="collaboration.html">🤝 Collaboration</a>
          <a href="messages.html">📨 Messages</a>
          <a href="orders.html">📦 Orders</a>
          <a href="payments.html">💳 Payments</a>
          <a href="delivery.html">🚚 Delivery</a>
        </nav>
        <div class="sidebar-footer">
          <a href="../../index.html" class="nav-link"><span class="nav-icon">🏠</span><span class="nav-label">Marketplace Home</span></a>
          <button type="button" class="logout-link-btn" id="sidebarLogoutButton"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></button>
        </div>
      </aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Product Discovery</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <div class="filter-grid">
            <div class="field">
              <label for="product-search">Search</label>
              <input
                id="product-search"
                type="search"
                placeholder="Search by product or supplier"
              />
            </div>
            <div class="field">
              <label for="product-category">Category</label>
              <select id="product-category"></select>
            </div>
            <div class="field">
              <label for="product-supplier">Supplier</label>
              <select id="product-supplier"></select>
            </div>
            <div class="field">
              <label for="product-availability">Availability</label>
              <select id="product-availability">
                <option value="">All</option>
                <option value="In Stock">In Stock</option>
                <option value="Low Stock">Low Stock</option>
              </select>
            </div>
            <div class="field">
              <label for="product-sort">Sort</label>
              <select id="product-sort">
                <option value="name">Name</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button class="btn btn-primary" type="button" id="product-reset">
                Reset Filters
              </button>
            </div>
          </div>
        </section>

        <section>
          <div id="product-list" class="card-grid"></div>
        </section>
      </main>
    </div>
    <script src="../../js/product-service.js"></script>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
  </body>
</html>

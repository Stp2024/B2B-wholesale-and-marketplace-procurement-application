<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Suppliers</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
</head>
  <body data-page="suppliers">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Supplier Discovery</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <div class="filter-grid">
            <div class="field">
              <label for="supplier-search">Search suppliers</label>
              <input
                id="supplier-search"
                type="search"
                placeholder="Business, category or location"
              />
            </div>
            <div class="field">
              <label for="supplier-location">Location</label>
              <select id="supplier-location">
                <option value="">All locations</option>
                <option value="Bengaluru">Bengaluru</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Delhi">Delhi NCR</option>
                <option value="Ahmedabad">Ahmedabad</option>
                <option value="Pune">Pune</option>
              </select>
            </div>
            <div class="field">
              <label for="supplier-category">Category</label>
              <select id="supplier-category"></select>
            </div>
            <div class="field">
              <label for="supplier-sort">Sort</label>
              <select id="supplier-sort">
                <option value="trust">Trust Score</option>
                <option value="name">Name</option>
              </select>
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button class="btn btn-primary" type="button" id="supplier-reset">
                Reset Filters
              </button>
            </div>
          </div>
        </section>

        <section>
          <div id="supplier-list" class="card-grid supplier-discovery-grid"></div>
        </section>
      </main>
    </div>
    <script src="../../js/product-service.js"></script>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

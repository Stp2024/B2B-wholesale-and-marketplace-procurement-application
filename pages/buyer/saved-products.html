<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Saved Products</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css" />
  </head>
  <body data-page="saved-products">
    <div class="module-shell">
      <aside class="module-sidebar">
        <div class="brand">
          <div class="logo">
            <img src="../../images/TradeNest.webp" alt="TradeNest" />
          </div>
          <div class="brand-text">
            <h2>TradeNest</h2>
            <span>Buyer Workspace</span>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="Buyer navigation">
          <a href="dashboard.html">📊 Dashboard</a>
          <a href="products.html">🛍️ Products</a>
          <a href="suppliers.html">🏢 Suppliers</a>
          <a href="saved-products.html" class="active">💾 Saved Products</a>
          <a href="saved-suppliers.html">📁 Saved Suppliers</a>
          <a href="profile.html">👤 Profile</a>
          <a href="settings.html">⚙️ Settings</a>
          <a href="rfqs.html">📝 RFQs</a>
          <a href="quotations.html">💬 Quotations</a>
          <a href="compare-quotes.html">⚖️ Compare</a>
          <a href="orders.html">📦 Orders</a>
        </nav>
      </aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Saved Products</h1>
          </div>
          <a href="products.html" class="btn btn-primary">Browse Products</a>
        </header>

        <section class="page-panel">
          <div class="filter-grid">
            <div class="field">
              <label for="saved-product-search">Search</label>
              <input id="saved-product-search" type="search" placeholder="Search by product or supplier" />
            </div>
            <div class="field">
              <label for="saved-product-category">Category</label>
              <select id="saved-product-category"><option value="">All categories</option></select>
            </div>
            <div class="field">
              <label for="saved-product-supplier">Supplier</label>
              <select id="saved-product-supplier"><option value="">All suppliers</option></select>
            </div>
            <div class="field">
              <label for="saved-product-sort">Sort</label>
              <select id="saved-product-sort">
                <option value="name">Name</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
              </select>
            </div>
            <div class="field">
              <label>&nbsp;</label>
              <button class="btn btn-secondary" type="button" id="saved-product-reset">Reset Filters</button>
            </div>
          </div>
        </section>

        <section>
          <div id="saved-product-list" class="card-grid"></div>
        </section>
      </main>
    </div>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
  </body>
</html>

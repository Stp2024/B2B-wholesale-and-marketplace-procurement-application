<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Details</title>
    <link rel="stylesheet" href="../../css/buyer/dashboard.css" />
    <link rel="stylesheet" href="../../css/shared.css" />
    <script src="../../js/product-service.js"></script>
    <style>
      body {
        margin: 0;
        background: #f4f7fb;
        font-family: Arial, sans-serif;
      }
      .detail-shell {
        padding: 24px;
      }
      .detail-top {
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        padding: 24px;
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 20px;
        align-items: center;
      }
      .supplier-logo {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        background: linear-gradient(135deg, #0f766e, #14b8a6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2.4rem;
        font-weight: 800;
      }
      .detail-top h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 2.2vw, 2.5rem);
      }
      .meta-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
      }
      .pill {
        background: #eff6ff;
        color: #1d4ed8;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
      }
      .product-grid {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .product-card {
        background: white;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
      }
      .product-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .product-card h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .product-card p {
        color: #475569;
        min-height: 48px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: #0f766e;
        color: white;
      }
      .btn-secondary {
        background: white;
        border-color: #cbd5e1;
        color: #0f172a;
      }
      @media (max-width: 700px) {
        .detail-top {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .supplier-logo {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html" class="brand-logo" aria-label="Buyer dashboard home">
            <img src="../../images/TradeNest.webp" alt="TradeNest" class="dashboard-brand-image" />
          </a>
          <span class="brand-subtitle">Buyer Workspace</span>
        </div>
        <nav class="sidebar-nav" aria-label="Buyer Navigation">
          <div class="nav-section">
            <span class="nav-section-title">Main Menu</span>
            <ul class="nav-list">
              <li><a href="dashboard.html" class="nav-link"><span class="nav-icon"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span class="nav-label">Dashboard</span></a></li>
              <li><a href="products.html" class="nav-link"><span class="nav-icon"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>️</span><span class="nav-label">Products</span></a></li>
              <li><a href="suppliers.html" class="nav-link"><span class="nav-icon"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="9" y1="22" x2="9" y2="22.01"/><line x1="15" y1="22" x2="15" y2="22.01"/><line x1="9" y1="6" x2="9" y2="6.01"/><line x1="15" y1="6" x2="15" y2="6.01"/></svg></span><span class="nav-label">Suppliers</span></a></li>
            </ul>
          </div>
        </nav>
      </aside>

      <div class="main-wrapper">
        <header class="top-navbar">
          <div class="navbar-left" style="display: flex; align-items: center; gap: 14px;">
            <div class="page-title-group">
              <h1 class="page-title">Supplier Details</h1>
            </div>
          </div>
        </header>

        <main class="detail-shell">
          <div class="detail-top">
            <div class="supplier-logo" id="supplier-logo">S</div>
            <div>
              <h1 id="supplier-name">Loading supplier...</h1>
              <p id="supplier-description">Loading description...</p>
              <div class="meta-grid">
                <span class="pill" id="supplier-location">Location</span>
                <span class="pill" id="supplier-category">Category</span>
                <span class="pill" id="supplier-trust">Trust</span>
              </div>
              <div class="detail-actions" style="margin-top: 18px;">
                <button id="save-supplier-btn" class="btn btn-secondary" type="button">Save Supplier</button>
              </div>
            </div>
          </div>

          <div class="product-grid" id="supplier-products"></div>
        </main>
      </div>
    </div>

    <script src="../../js/tradenest-store.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const store = window.TradeNestStore;
        const params = new URLSearchParams(window.location.search);
        const requested = (params.get("id") || params.get("supplier") || params.get("company") || params.get("name") || params.get("q") || "").trim();
        const fallbackId = JSON.parse(localStorage.getItem("tradenestSelectedSupplierId") || '"supplier-abc"');
        const queryTerm = requested || fallbackId;

        const storeProfiles = store ? (store.getStore().supplierProfiles || []) : [];
        let allSuppliers = [...storeProfiles];

        if (window.TradeNestProductService && typeof window.TradeNestProductService.getSuppliers === "function") {
          try {
            const svcSuppliers = window.TradeNestProductService.getSuppliers();
            svcSuppliers.forEach(ss => {
              if (!allSuppliers.some(s => s.id === ss.id || (s.businessName && ss.name && s.businessName.toLowerCase() === ss.name.toLowerCase()))) {
                allSuppliers.push({
                  id: ss.id,
                  businessName: ss.name,
                  location: ss.location,
                  category: "Industrial Equipment",
                  description: `Verified wholesale supplier ${ss.name}.`,
                  trustScore: ss.trustScore || 96,
                  verificationStatus: ss.verificationStatus || "Verified"
                });
              }
            });
          } catch(e) {}
        }

        const cleanQ = queryTerm.toLowerCase();
        let supplier = allSuppliers.find(s => s.id.toLowerCase() === cleanQ) ||
          allSuppliers.find(s => s.businessName && s.businessName.toLowerCase() === cleanQ) ||
          allSuppliers.find(s => s.altNames && s.altNames.some(alt => alt.toLowerCase() === cleanQ)) ||
          allSuppliers.find(s => s.businessName && s.businessName.toLowerCase().includes(cleanQ)) ||
          allSuppliers.find(s => cleanQ.includes("abc") && (s.id === "supplier-abc" || s.businessName.toLowerCase().includes("abc"))) ||
          allSuppliers[0];

        if (supplier) {
          localStorage.setItem("tradenestSelectedSupplierId", JSON.stringify(supplier.id));
          document.getElementById("supplier-logo").textContent = supplier.logo || (supplier.businessName || "S").charAt(0);
          document.getElementById("supplier-name").textContent = supplier.businessName;
          document.getElementById("supplier-description").textContent = supplier.description;
          document.getElementById("supplier-location").textContent = supplier.location;
          document.getElementById("supplier-category").textContent = supplier.category;
          document.getElementById("supplier-trust").textContent = `Trust ${supplier.trustScore}/100`;

          let products = [];
          const seenPids = new Set();

          function matchesSupplier(p, sup) {
            if (!p || !sup) return false;
            if (p.supplierId && p.supplierId === sup.id) return true;
            const supName = (sup.businessName || "").toLowerCase();
            const pSupName = (p.supplierName || "").toLowerCase();
            if (pSupName && pSupName === supName) return true;
            if (sup.altNames && sup.altNames.some(a => a.toLowerCase() === pSupName)) return true;
            if (supName && pSupName && (pSupName.includes(supName) || supName.includes(pSupName))) return true;
            if (sup.products && Array.isArray(sup.products) && sup.products.includes(p.id)) return true;
            return false;
          }

          if (window.TradeNestProductService && typeof window.TradeNestProductService.getProductsSync === "function") {
            try {
              const sps = window.TradeNestProductService.getProductsSync({ includeAllStatuses: true }) || [];
              sps.forEach(p => {
                if (matchesSupplier(p, supplier) && !seenPids.has(p.id)) {
                  seenPids.add(p.id);
                  products.push(p);
                }
              });
            } catch(e) {}
          }

          if (store) {
            try {
              const storeProds = store.getStore().products || [];
              storeProds.forEach(p => {
                if (matchesSupplier(p, supplier) && !seenPids.has(p.id)) {
                  seenPids.add(p.id);
                  products.push(p);
                }
              });
            } catch(e) {}
          }

          const container = document.getElementById("supplier-products");
          container.innerHTML = products.map((product) => {
            let img = product.image || "../../images/products/industrial-safety-gloves.webp";
            if (img.startsWith("../../../")) img = img.replace("../../../", "../../");
            else if (!img.startsWith("../../") && !img.startsWith("http") && !img.startsWith("data:")) {
              img = "../../" + img.replace(/^\/+/, "");
            }
            const priceText = product.price ? `₹${Number(product.price).toLocaleString("en-IN")}` : "Contact for Quote";
            return `
              <article class="product-card" style="display:flex;flex-direction:column;">
                <img src="${img}" alt="${product.name}" onerror="this.src='../../images/products/industrial-safety-gloves.webp'" style="height:170px;object-fit:contain;background:#f8fafc;padding:10px;border-radius:10px;" />
                <span class="pill" style="align-self:flex-start;margin-top:10px;">${product.category}</span>
                <h3 style="margin:8px 0 6px;font-size:1.05rem;">${product.name}</h3>
                <p style="font-size:0.85rem;color:#64748b;margin:0 0 10px;flex:1;">${product.description || ""}</p>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;">
                  <span style="font-size:1.1rem;color:#0f172a;">${priceText}</span>
                  <span style="font-size:0.8rem;color:#64748b;">MOQ: ${product.moq || 1}</span>
                </div>
                <a class="btn btn-primary" href="product-details.html?id=${product.id}" style="text-align:center;">View Product</a>
              </article>
            `;
          }).join("") || '<div class="product-card"><h3>No products</h3><p>This supplier has no catalog items yet.</p></div>';

          document.getElementById("save-supplier-btn").addEventListener("click", function () {
            const saved = JSON.parse(localStorage.getItem("tradenest_saved_suppliers") || "[]");
            const exists = (saved || []).some((item) => item && item.id === supplier.id);
            const list = exists ? saved : [...saved, {
              id: supplier.id,
              businessName: supplier.businessName,
              description: supplier.description,
              category: supplier.category,
              location: supplier.location,
              verificationStatus: supplier.verificationStatus,
              trustScore: supplier.trustScore,
              productCategories: supplier.products || [],
              logo: supplier.logo
            }];
            localStorage.setItem("tradenest_saved_suppliers", JSON.stringify(list));
            document.getElementById("save-supplier-btn").textContent = "Saved";
          });
        }
      });
    </script>
  </body>
</html>

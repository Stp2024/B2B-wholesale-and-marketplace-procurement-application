<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Details</title>
    <link rel="stylesheet" href="../../css/buyer/dashboard.css" />
    <link rel="stylesheet" href="../../css/shared.css" />
    <style>
      body {
        margin: 0;
        background: #f4f7fb;
        font-family: Arial, sans-serif;
      }
      .detail-shell {
        padding: 24px;
      }
      .detail-top {
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        padding: 24px;
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 20px;
        align-items: center;
      }
      .supplier-logo {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        background: linear-gradient(135deg, #0f766e, #14b8a6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2.4rem;
        font-weight: 800;
      }
      .detail-top h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 2.2vw, 2.5rem);
      }
      .meta-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
      }
      .pill {
        background: #eff6ff;
        color: #1d4ed8;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 700;
      }
      .product-grid {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .product-card {
        background: white;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
      }
      .product-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .product-card h3 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .product-card p {
        color: #475569;
        min-height: 48px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0.7rem 1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: #0f766e;
        color: white;
      }
      .btn-secondary {
        background: white;
        border-color: #cbd5e1;
        color: #0f172a;
      }
      @media (max-width: 700px) {
        .detail-top {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .supplier-logo {
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <a href="dashboard.html" class="brand-logo" aria-label="Buyer dashboard home">
            <img src="../../images/TradeNest.webp" alt="TradeNest" class="dashboard-brand-image" />
          </a>
          <span class="brand-subtitle">Buyer Workspace</span>
        </div>
        <nav class="sidebar-nav" aria-label="Buyer Navigation">
          <div class="nav-section">
            <span class="nav-section-title">Main Menu</span>
            <ul class="nav-list">
              <li><a href="dashboard.html" class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a></li>
              <li><a href="products.html" class="nav-link"><span class="nav-icon">🛍️</span><span class="nav-label">Products</span></a></li>
              <li><a href="suppliers.html" class="nav-link"><span class="nav-icon">🏢</span><span class="nav-label">Suppliers</span></a></li>
            </ul>
          </div>
        </nav>
      </aside>

      <div class="main-wrapper">
        <header class="top-navbar">
          <div class="navbar-left" style="display: flex; align-items: center; gap: 14px;">
            <div class="page-title-group">
              <h1 class="page-title">Supplier Details</h1>
            </div>
          </div>
        </header>

        <main class="detail-shell">
          <div class="detail-top">
            <div class="supplier-logo" id="supplier-logo">S</div>
            <div>
              <h1 id="supplier-name">Loading supplier...</h1>
              <p id="supplier-description">Loading description...</p>
              <div class="meta-grid">
                <span class="pill" id="supplier-location">Location</span>
                <span class="pill" id="supplier-category">Category</span>
                <span class="pill" id="supplier-trust">Trust</span>
              </div>
              <div class="detail-actions" style="margin-top: 18px;">
                <a href="suppliers.html" class="btn btn-primary">Back to Suppliers</a>
                <button id="save-supplier-btn" class="btn btn-secondary" type="button">Save Supplier</button>
              </div>
            </div>
          </div>

          <div class="product-grid" id="supplier-products"></div>
        </main>
      </div>
    </div>

    <script src="../../js/tradenest-store.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const store = window.TradeNestStore;
        const params = new URLSearchParams(window.location.search);
        const requestedId = params.get("id");
        const fallbackId = JSON.parse(localStorage.getItem("tradenestSelectedSupplierId") || '"supplier-001"');
        const supplierId = requestedId || fallbackId;
        const supplier = store.getStore().supplierProfiles.find((item) => item.id === supplierId) || store.getStore().supplierProfiles[0];

        if (supplier) {
          localStorage.setItem("tradenestSelectedSupplierId", JSON.stringify(supplier.id));
          document.getElementById("supplier-logo").textContent = supplier.logo || supplier.businessName.charAt(0);
          document.getElementById("supplier-name").textContent = supplier.businessName;
          document.getElementById("supplier-description").textContent = supplier.description;
          document.getElementById("supplier-location").textContent = supplier.location;
          document.getElementById("supplier-category").textContent = supplier.category;
          document.getElementById("supplier-trust").textContent = `Trust ${supplier.trustScore}/100`;

          const products = store.getStore().products.filter((item) => item.supplierId === supplier.id);
          const container = document.getElementById("supplier-products");
          container.innerHTML = products.map((product) => `
            <article class="product-card">
              <img src="${product.image}" alt="${product.name}" />
              <span class="pill">${product.category}</span>
              <h3>${product.name}</h3>
              <p>${product.description}</p>
              <a class="btn btn-secondary" href="product-details.html?id=${product.id}">View product</a>
            </article>
          `).join("") || '<div class="product-card"><h3>No products</h3><p>This supplier has no catalog items yet.</p></div>';

          document.getElementById("save-supplier-btn").addEventListener("click", function () {
            const saved = JSON.parse(localStorage.getItem("tradenest_saved_suppliers") || "[]");
            const exists = (saved || []).some((item) => item && item.id === supplier.id);
            const list = exists ? saved : [...saved, {
              id: supplier.id,
              businessName: supplier.businessName,
              description: supplier.description,
              category: supplier.category,
              location: supplier.location,
              verificationStatus: supplier.verificationStatus,
              trustScore: supplier.trustScore,
              productCategories: supplier.products || [],
              logo: supplier.logo
            }];
            localStorage.setItem("tradenest_saved_suppliers", JSON.stringify(list));
            document.getElementById("save-supplier-btn").textContent = "Saved";
          });
        }
      });
    </script>
  </body>
</html>

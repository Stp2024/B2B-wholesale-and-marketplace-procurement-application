<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link rel="stylesheet" href="../../css/buyer/dashboard.css?v=buyer-nav-4" />
    <link rel="stylesheet" href="../../css/shared.css" />
    <style>
      body {
        margin: 0;
        background: #f4f7fb;
        font-family: Arial, sans-serif;
      }
      .detail-layout {
        display: grid;
        grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
        gap: 24px;
        padding: 24px;
      }
      .detail-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }
      .detail-image {
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border-radius: 12px;
        background: #eef4ff;
      }
      .detail-meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(140px, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      .meta-box {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px 14px;
      }
      .meta-box small {
        display: block;
        color: #64748b;
        margin-bottom: 6px;
      }
      .detail-content h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 3vw, 2.5rem);
      }
      .detail-content .eyebrow {
        display: inline-block;
        background: #e0f2fe;
        color: #075985;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .detail-content p {
        color: #475569;
        line-height: 1.7;
      }
      .detail-price {
        font-size: 2rem;
        font-weight: 800;
        color: #0f172a;
        margin-top: 18px;
      }
      .detail-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0.8rem 1.1rem;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: #0f766e;
        color: white;
      }
      .btn-secondary {
        background: white;
        border-color: #cbd5e1;
        color: #0f172a;
      }
      @media (max-width: 820px) {
        .detail-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
</head>
  <body>
    <div class="dashboard-container">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>

      <div class="main-wrapper">
        <header class="top-navbar">
          <div class="navbar-left" style="display: flex; align-items: center; gap: 14px;">
            <div class="page-title-group">
              <h1 class="page-title">Product Details</h1>
            </div>
          </div>
        </header>

        <main class="content-panel" style="padding: 24px;">
          <div class="detail-layout">
            <div class="detail-card">
              <img id="detail-image" class="detail-image" src="" alt="Product" />
              <div class="detail-meta">
                <div class="meta-box"><small>Category</small><strong id="detail-category">-</strong></div>
                <div class="meta-box"><small>Availability</small><strong id="detail-availability">-</strong></div>
                <div class="meta-box"><small>MOQ</small><strong id="detail-moq">-</strong></div>
                <div class="meta-box"><small>Stock</small><strong id="detail-stock">-</strong></div>
              </div>
            </div>

            <div class="detail-card detail-content">
              <span class="eyebrow" id="detail-supplier">Supplier</span>
              <h1 id="detail-name">Loading product...</h1>
              <p id="detail-description">Loading product description...</p>
              <div class="detail-price-wrap" style="margin: 18px 0;">
                <div class="detail-price" id="detail-price" style="margin: 0;">₹0</div>
                <div id="bulk-price-hint" style="font-size: 0.85rem; color: #059669; font-weight: 600; margin-top: 4px;"></div>
              </div>

              <!-- QUANTITY & TOTAL CALCULATOR -->
              <div class="order-calculator-card" style="background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px; margin: 20px 0;">
                <label style="display: block; font-size: 0.82rem; font-weight: 700; color: #475569; margin-bottom: 8px;">Order Quantity (<span id="unit-label">units</span>)</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <button type="button" id="qty-dec-btn" style="width: 38px; height: 38px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; font-size: 1.1rem; font-weight: 700;">-</button>
                  <input type="number" id="order-qty-input" style="width: 110px; height: 38px; border: 1.5px solid #cbd5e1; border-radius: 8px; text-align: center; font-size: 1rem; font-weight: 700;" value="1" min="1" />
                  <button type="button" id="qty-inc-btn" style="width: 38px; height: 38px; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; font-size: 1.1rem; font-weight: 700;">+</button>
                  <span id="qty-stock-warning" style="font-size: 0.82rem; color: #dc2626; font-weight: 600; margin-left: 8px; display: none;"></span>
                </div>
                <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                  <span style="font-size: 0.9rem; color: #64748b;">Estimated Total (incl. 18% GST):</span>
                  <strong id="estimated-total" style="font-size: 1.25rem; color: #0f172a;">₹0</strong>
                </div>
              </div>

              <div class="detail-actions">
                <button id="save-product-btn" class="btn btn-secondary" type="button">Save Product</button>
                <a id="rfq-btn" href="request-quote.html" class="btn btn-secondary" style="border-color:#0f766e;color:#0f766e;">Request a Quote</a>
                <button id="buy-now-btn" class="btn btn-primary" type="button" style="background:linear-gradient(135deg,#10b981,#059669);border:none;color:#fff;box-shadow:0 4px 14px rgba(5,150,105,0.3);"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Buy Now</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/tradenest-store.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const store = window.TradeNestStore;
        const params = new URLSearchParams(window.location.search);
        const requestedId = params.get("id");
        const fallbackId = JSON.parse(localStorage.getItem("tradenestSelectedProductId") || '"product-001"');
        const productId = requestedId || fallbackId;
        const product = store.getStore().products.find((item) => item.id === productId) || store.getStore().products[0];

        if (product) {
          localStorage.setItem("tradenestSelectedProductId", JSON.stringify(product.id));
          document.getElementById("detail-image").src = product.image;
          document.getElementById("detail-image").alt = product.name;
          document.getElementById("detail-name").textContent = product.name;
          document.getElementById("detail-description").textContent = product.description;
          document.getElementById("detail-category").textContent = product.category;
          document.getElementById("detail-availability").textContent = product.availability;
          document.getElementById("detail-moq").textContent = `${product.moq} ${product.unit}`;
          document.getElementById("detail-stock").textContent = `${product.stock} ${product.unit}`;
          document.getElementById("detail-price").textContent = `₹${product.price}`;
          document.getElementById("detail-supplier").textContent = product.supplierName || "Supplier";
          document.getElementById("unit-label").textContent = product.unit || "units";

          const moq = Number(product.moq) || 1;
          const stock = Number(product.stock) || 0;
          const qtyInput = document.getElementById("order-qty-input");
          const decBtn = document.getElementById("qty-dec-btn");
          const incBtn = document.getElementById("qty-inc-btn");
          const warningEl = document.getElementById("qty-stock-warning");
          const totalEl = document.getElementById("estimated-total");
          const bulkHintEl = document.getElementById("bulk-price-hint");
          const rfqBtn = document.getElementById("rfq-btn");

          if (rfqBtn) {
            rfqBtn.href = `request-quote.html?productId=${encodeURIComponent(product.id)}`;
          }

          if (product.bulkPrice && product.bulkPrice < product.price) {
            bulkHintEl.textContent = `Bulk volume price: ₹${product.bulkPrice}/${product.unit} (for orders ≥ ${moq} ${product.unit})`;
          }

          qtyInput.value = moq;
          qtyInput.min = moq;
          if (stock > 0) qtyInput.max = stock;

          function updateCalculator() {
            let val = parseInt(qtyInput.value, 10);
            if (isNaN(val) || val < 1) val = 1;

            if (val < moq) {
              warningEl.textContent = `MOQ is ${moq} ${product.unit}`;
              warningEl.style.display = "inline";
            } else if (stock > 0 && val > stock) {
              warningEl.textContent = `Exceeds stock (${stock} available)`;
              warningEl.style.display = "inline";
            } else {
              warningEl.style.display = "none";
            }

            const totals = store.calculateOrderTotals 
              ? store.calculateOrderTotals(product, val) 
              : { totalAmount: Math.round(val * (product.price || 0) * 1.18) };
            totalEl.textContent = store.formatCurrency(totals.totalAmount);
          }

          decBtn.addEventListener("click", function () {
            let val = parseInt(qtyInput.value, 10) || moq;
            if (val > moq) {
              qtyInput.value = val - 1;
              updateCalculator();
            }
          });

          incBtn.addEventListener("click", function () {
            let val = parseInt(qtyInput.value, 10) || moq;
            if (stock <= 0 || val < stock) {
              qtyInput.value = val + 1;
              updateCalculator();
            }
          });

          qtyInput.addEventListener("input", updateCalculator);
          updateCalculator();

          const saveBtn = document.getElementById("save-product-btn");
          saveBtn.addEventListener("click", function () {
            const saved = JSON.parse(localStorage.getItem("tradenest_saved_products") || "[]");
            const exists = (saved || []).some((item) => item && item.id === product.id);
            const list = exists ? saved : [...saved, {
              id: product.id,
              name: product.name,
              description: product.description,
              category: product.category,
              supplierName: product.supplierName,
              price: product.price,
              bulkPrice: product.bulkPrice,
              moq: product.moq,
              stock: product.stock,
              availability: product.availability,
              image: product.image
            }];
            localStorage.setItem("tradenest_saved_products", JSON.stringify(list));
            saveBtn.textContent = "Saved";
          });

          const buyNowBtn = document.getElementById("buy-now-btn");
          if (buyNowBtn) {
            buyNowBtn.addEventListener("click", function () {
              const qty = parseInt(qtyInput.value, 10) || moq;
              if (qty < moq) {
                alert(`Minimum order quantity for this item is ${moq} ${product.unit}.`);
                return;
              }
              if (stock > 0 && qty > stock) {
                alert(`Requested quantity (${qty}) exceeds available stock (${stock}).`);
                return;
              }
              const query = new URLSearchParams({
                id:       product.id,
                qty:      qty,
                name:     product.name,
                price:    product.price,
                unit:     product.unit || "unit",
                moq:      product.moq  || 1,
                supplier: product.supplierName || "Supplier",
                img:      product.image || "",
                category: product.category || "General",
                from:     "product-details"
              });
              window.location.href = "checkout.html?" + query.toString();
            });
          }
        }
      });
    </script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

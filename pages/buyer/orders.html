<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — TradeNest Buyer</title>
  <meta name="description" content="View and manage all your purchase orders on TradeNest." />
  <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
  <link rel="stylesheet" href="../../css/shared.css" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
  </head>
<body data-page="orders">
  <div class="module-shell">
    <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
    <main class="module-main">
      <header class="module-header">
        <div class="module-header-title">
          <h1>My Orders</h1>
          <span class="badge badge-blue" id="orderCountBadge">0 orders</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <button type="button" id="refreshOrders" class="btn btn-secondary btn-sm">Refresh</button>
          <input type="search" id="orderSearch" class="form-control" placeholder="Search orders…" style="width:200px;">
          <select id="orderStatusFilter" class="form-control" style="width:160px;">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <select id="orderSortFilter" class="form-control" style="width:160px;">
            <option value="date-desc">Newest First</option>
            <option value="date-asc">Oldest First</option>
            <option value="amount-desc">Highest Amount</option>
            <option value="amount-asc">Lowest Amount</option>
          </select>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats-grid" id="orderStats"></div>

      <!-- Order List -->
      <section class="page-panel">
        <div class="tn-table-wrap">
          <table class="tn-table" id="ordersTable">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Product</th>
                <th>Supplier</th>
                <th>Qty</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="8"><div class="empty-state">Loading orders…</div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Order Detail Modal -->
      <div class="tn-modal-backdrop" id="orderDetailModal" style="display:none;" role="dialog" aria-modal="true">
        <div class="tn-modal-card" style="max-width:640px;">
          <div class="tn-modal-header">
            <h2 class="tn-modal-title">Order Details</h2>
            <button class="tn-modal-close" id="closeOrderModal">&times;</button>
          </div>
          <div class="tn-modal-body" id="orderDetailBody"></div>
          <div class="tn-modal-footer">
            <button class="btn btn-primary btn-sm" id="btnOpenInvoiceFromModal" style="display:none;">View Invoice / Summary</button>
            <button class="btn btn-secondary btn-sm" id="closeOrderModalFooter">Close</button>
          </div>
        </div>
      </div>

      <!-- Invoice / Order Summary Modal (Extra Feature 5) -->
      <div class="tn-invoice-modal" id="invoiceModal" role="dialog" aria-modal="true" aria-label="Order Invoice Preview">
        <div class="tn-invoice-paper">
          <div class="tn-invoice-actions">
            <button type="button" class="btn btn-primary btn-sm" id="btnPrintInvoice"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>️ Print / Save as PDF</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btnCloseInvoice">Close</button>
          </div>
          <div id="invoiceContent">
            <!-- Dynamically injected -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/tradenest-store.js"></script>
  <script src="../../js/buyer/modules.js"></script>
  <script>
  (function() {
    const store = window.TradeNestStore;
    if (!store) return;

    let activeSelectedOrderId = null;

    function formatCurrency(v) { return store.formatCurrency(v); }
    function formatDate(v) {
      if (!v) return '—';
      const d = new Date(v);
      return isNaN(d) ? v : d.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'});
    }

    function getStatusClass(status) {
      const s = String(status || '').toLowerCase();
      if (s.includes('delivered') || s.includes('completed')) return 'status-completed';
      if (s.includes('shipped')) return 'status-processing';
      if (s.includes('cancelled') || s.includes('rejected')) return 'status-cancelled';
      if (s.includes('processing') || s.includes('confirmed')) return 'status-processing';
      return 'status-pending';
    }

    function getState() { return store.getStore(); }

    function getBuyerOrders() {
      const state = getState();
      const user = store.getCurrentUser();
      const buyerId = user && user.id ? user.id : 'buyer-001';
      return (state.orders || []).filter(o => o.buyerId === buyerId || o.buyerId === 'buyer-001');
    }

    function renderStats(orders) {
      const total = orders.length;
      const pending = orders.filter(o => ['Pending','Processing','Confirmed'].includes(o.status)).length;
      const delivered = orders.filter(o => ['Delivered','Completed'].includes(o.status)).length;
      const spent = orders.filter(order => ['Paid','Completed','Escrow Funded'].includes(String(order.paymentStatus || '').trim()) || ['Delivered','Completed'].includes(String(order.status || '').trim())).reduce((sum, order) => sum + (Number(order.totalAmount ?? order.amount) || 0), 0);
      document.getElementById('orderStats').innerHTML = [
        {label:'Total Orders', value: total, icon:'<svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>'},
        {label:'Active/Pending', value: pending, icon:'⏳'},
        {label:'Delivered', value: delivered, icon:''},
        {label:'Total Spent', value: formatCurrency(spent), icon:'<svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'}
      ].map(s => `<div class="stat-card"><h3><span class="stat-card-icon" aria-hidden="true">${s.icon}</span><span>${s.label}</span></h3><strong>${s.value}</strong></div>`).join('');
    }

    function renderOrders(orders) {
      const search = (document.getElementById('orderSearch').value || '').toLowerCase();
      const statusFilter = document.getElementById('orderStatusFilter').value;
      const sort = document.getElementById('orderSortFilter').value;

      let filtered = orders.filter(o => {
        const matchSearch = !search || String(o.productName || o.id || '').toLowerCase().includes(search) || String(o.supplierName || '').toLowerCase().includes(search);
        const matchStatus = !statusFilter || o.status === statusFilter;
        return matchSearch && matchStatus;
      });

      filtered.sort((a, b) => {
        if (sort === 'date-asc') return new Date(a.createdAt) - new Date(b.createdAt);
        if (sort === 'amount-desc') return (Number(b.totalAmount || b.amount) || 0) - (Number(a.totalAmount || a.amount) || 0);
        if (sort === 'amount-asc') return (Number(a.totalAmount || a.amount) || 0) - (Number(b.totalAmount || b.amount) || 0);
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      document.getElementById('orderCountBadge').textContent = filtered.length + ' order' + (filtered.length !== 1 ? 's' : '');

      const tbody = document.getElementById('ordersTableBody');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon"><svg class="tn-ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div><p class="empty-state-title">No orders found</p><p class="empty-state-text">Your matched orders will appear here.</p></div></td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(o => `
        <tr>
          <td><strong>#${o.id}</strong></td>
          <td>${o.productName || '—'}</td>
          <td>${o.supplierName || '—'}</td>
          <td>${o.quantity || '—'}</td>
          <td>${formatCurrency(o.totalAmount || o.amount || 0)}</td>
          <td><span class="status-badge ${getStatusClass(o.status)}">${o.status}</span></td>
          <td>${formatDate(o.createdAt || o.orderDate)}</td>
          <td>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              <button class="btn btn-primary btn-sm" data-view-order="${o.id}">View</button>
              <button class="btn btn-secondary btn-sm" data-view-invoice="${o.id}">Invoice</button>
              ${['Delivered','Completed'].includes(String(o.status || '').trim()) ? `<a class="btn btn-secondary btn-sm" href="reviews-feedback.html?orderId=${encodeURIComponent(o.id)}">${o.productReview && o.supplierReview ? 'Reviews submitted' : 'Review order'}</a>` : ''}
            </div>
          </td>
        </tr>`).join('');
    }

    function showOrderDetail(orderId) {
      const state = getState();
      const order = (state.orders || []).find(o => o.id === orderId);
      if (!order) return;
      activeSelectedOrderId = orderId;
      const modal = document.getElementById('orderDetailModal');
      const body = document.getElementById('orderDetailBody');
      const invoiceBtn = document.getElementById('btnOpenInvoiceFromModal');
      if (invoiceBtn) invoiceBtn.style.display = 'inline-flex';

      body.innerHTML = `
        <div class="profile-modal-grid" style="gap:14px;">
          ${[
            ['Order ID', '#' + order.id],
            ['Product', order.productName],
            ['Supplier', order.supplierName],
            ['Quantity', order.quantity],
            ['Unit', order.unit || 'units'],
            ['Amount', formatCurrency(order.totalAmount || order.amount || 0)],
            ['Status', order.status],
            ['Order Date', formatDate(order.createdAt || order.orderDate)],
            ['Delivery Date', formatDate(order.deliveryDate) || 'TBD'],
            ['Notes', order.notes || '—']
          ].map(([k,v]) => `<div class="modal-field"><span class="field-label">${k}</span><p class="field-value">${v || '—'}</p></div>`).join('')}
        </div>`;
      modal.style.display = 'flex';
    }

    /* Extra Feature 5: Invoice Generator */
    function showInvoice(orderId) {
      const state = getState();
      const order = (state.orders || []).find(o => o.id === orderId);
      if (!order) return;

      const user = store.getCurrentUser() || {};
      const modal = document.getElementById('invoiceModal');
      const content = document.getElementById('invoiceContent');

      const qty = Number(order.quantity) || 1;
      const totalAmount = Number(order.totalAmount || order.amount) || 0;
      const unitPrice = order.unitPrice || Math.round((totalAmount / 1.18) / qty);
      const subtotal = unitPrice * qty;
      const gst = Math.round(subtotal * 0.18);
      const shipping = order.shippingFee !== undefined ? Number(order.shippingFee) : (subtotal >= 50000 ? 0 : 750);
      const grandTotal = subtotal + gst + shipping;

      content.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--color-border);padding-bottom:18px;margin-bottom:24px;">
          <div>
            <h1 style="font-size:1.6rem;color:var(--color-heading);margin-bottom:4px;font-weight:800;">TradeNest</h1>
            <p style="font-size:0.85rem;color:var(--color-text-secondary);">B2B Wholesale & Procurement Marketplace</p>
          </div>
          <div style="text-align:right;">
            <span class="tn-invoice-badge-demo">Demo Order Summary / Invoice</span>
            <p style="font-size:0.88rem;color:var(--color-heading);font-weight:700;margin-top:6px;">Invoice #: INV-${order.id}</p>
            <p style="font-size:0.8rem;color:var(--color-text-secondary);">Order Date: ${formatDate(order.createdAt || order.orderDate)}</p>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;font-size:0.88rem;">
          <div style="background:var(--color-ice-white);padding:14px 18px;border-radius:var(--radius-md);border:1px solid var(--color-border);">
            <strong style="color:var(--color-heading);display:block;margin-bottom:4px;">Seller (Supplier):</strong>
            <p style="color:var(--color-heading);font-weight:600;">${order.supplierName || 'TradeNest Verified Supplier'}</p>
            <p style="color:var(--color-text-secondary);font-size:0.82rem;">Business Verification: Verified Partner</p>
            <p style="color:var(--color-text-secondary);font-size:0.82rem;">Dispatch Location: India</p>
          </div>
          <div style="background:var(--color-ice-white);padding:14px 18px;border-radius:var(--radius-md);border:1px solid var(--color-border);">
            <strong style="color:var(--color-heading);display:block;margin-bottom:4px;">Billed & Shipped To (Buyer):</strong>
            <p style="color:var(--color-heading);font-weight:600;">${order.buyerName || user.businessName || user.fullName || 'TradeNest Buyer'}</p>
            <p style="color:var(--color-text-secondary);font-size:0.82rem;">${order.deliveryAddress || 'Primary Business Address, Bengaluru, Karnataka'}</p>
            <p style="color:var(--color-text-secondary);font-size:0.82rem;">Payment Method: ${order.paymentMethod || 'Online Escrow (Simulated)'}</p>
          </div>
        </div>

        <table class="tn-invoice-table">
          <thead>
            <tr>
              <th>Item Description</th>
              <th style="text-align:center;">Qty</th>
              <th style="text-align:right;">Unit Price</th>
              <th style="text-align:right;">Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <strong>${order.productName || 'Wholesale Goods'}</strong>
                <div style="font-size:0.75rem;color:var(--color-text-secondary);">Order Reference: #${order.id}</div>
              </td>
              <td style="text-align:center;">${qty} ${order.unit || 'units'}</td>
              <td style="text-align:right;">${formatCurrency(unitPrice)}</td>
              <td style="text-align:right;"><strong>${formatCurrency(subtotal)}</strong></td>
            </tr>
          </tbody>
        </table>

        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:20px;">
          <div style="font-size:0.78rem;color:var(--color-text-secondary);max-width:340px;line-height:1.4;">
            <p><strong>Note:</strong> This document is a frontend demonstration order summary generated from your browser session records. All tax calculations (18% GST) and shipping estimates adhere to standard procurement rules.</p>
          </div>
          <div class="tn-invoice-summary-box">
            <div class="tn-invoice-row">
              <span>Item Subtotal:</span>
              <span>${formatCurrency(subtotal)}</span>
            </div>
            <div class="tn-invoice-row">
              <span>GST (18% IGST):</span>
              <span>${formatCurrency(gst)}</span>
            </div>
            <div class="tn-invoice-row">
              <span>Delivery & Handling:</span>
              <span>${shipping === 0 ? 'FREE' : formatCurrency(shipping)}</span>
            </div>
            <div class="tn-invoice-row is-total">
              <span>Total Payable:</span>
              <span style="color:var(--color-steel-blue);">${formatCurrency(grandTotal)}</span>
            </div>
          </div>
        </div>
      `;

      modal.classList.add('is-open');
    }

    let orders = getBuyerOrders();
    function refreshOrders() {
      orders = getBuyerOrders();
      renderStats(orders);
      renderOrders(orders);
    }
    refreshOrders();
    document.getElementById('refreshOrders').addEventListener('click', refreshOrders);
    window.addEventListener('focus', refreshOrders);
    window.addEventListener('storage', (event) => {
      if (!event.key || event.key.toLowerCase().includes('order') || event.key.toLowerCase().includes('store')) refreshOrders();
    });

    ['orderSearch','orderStatusFilter','orderSortFilter'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => renderOrders(orders));
      if (el) el.addEventListener('change', () => renderOrders(orders));
    });

    document.addEventListener('click', e => {
      const viewBtn = e.target.closest('[data-view-order]');
      if (viewBtn) showOrderDetail(viewBtn.getAttribute('data-view-order'));

      const invBtn = e.target.closest('[data-view-invoice]');
      if (invBtn) showInvoice(invBtn.getAttribute('data-view-invoice'));
    });

    const openInvFromModalBtn = document.getElementById('btnOpenInvoiceFromModal');
    if (openInvFromModalBtn) {
      openInvFromModalBtn.addEventListener('click', () => {
        if (activeSelectedOrderId) {
          document.getElementById('orderDetailModal').style.display = 'none';
          showInvoice(activeSelectedOrderId);
        }
      });
    }

    const printBtn = document.getElementById('btnPrintInvoice');
    if (printBtn) {
      printBtn.addEventListener('click', () => {
        window.print();
      });
    }

    const closeInvBtn = document.getElementById('btnCloseInvoice');
    if (closeInvBtn) {
      closeInvBtn.addEventListener('click', () => {
        document.getElementById('invoiceModal').classList.remove('is-open');
      });
    }

    const closeModal = () => { document.getElementById('orderDetailModal').style.display = 'none'; };
    document.getElementById('closeOrderModal').addEventListener('click', closeModal);
    document.getElementById('closeOrderModalFooter').addEventListener('click', closeModal);
    document.getElementById('orderDetailModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  })();
  </script>
  <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

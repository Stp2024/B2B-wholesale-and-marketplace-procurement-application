<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Sample Requests</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
</head>
  <body data-page="samples">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Sample Requests</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <form id="sample-form">
            <div class="form-grid">
              <div class="field">
                <label for="sample-product">Product</label>
                <select id="sample-product" name="productId" required></select>
              </div>
              <div class="field">
                <label for="sample-supplier">Supplier</label>
                <select
                  id="sample-supplier"
                  name="supplierId"
                  required
                ></select>
              </div>
              <div class="field">
                <label for="sample-quantity">Requested quantity</label>
                <input
                  id="sample-quantity"
                  name="quantity"
                  type="number"
                  min="1"
                  required
                />
              </div>
              <div class="field">
                <label for="sample-address">Delivery address</label>
                <input
                  id="sample-address"
                  name="deliveryAddress"
                  type="text"
                  value="Bengaluru"
                  required
                />
              </div>
              <div class="field" style="grid-column: 1 / -1">
                <label for="sample-notes">Additional requirements</label>
                <textarea id="sample-notes" name="notes"></textarea>
              </div>
            </div>
            <div class="button-row" style="margin-top: 18px">
              <button class="btn btn-primary" type="submit">
                Save Sample Request
              </button>
            </div>
          </form>
        </section>

        <section class="page-panel">
          <h2>My Sample Requests</h2>
          <div id="sample-list" class="record-grid"></div>
        </section>
      </main>
    </div>
    <dialog id="sample-feedback-dialog" class="sample-feedback-dialog" aria-labelledby="sample-feedback-title">
      <form id="sample-feedback-form">
        <h2 id="sample-feedback-title">Share sample feedback</h2>
        <p id="sample-feedback-product"></p>
        <input id="sample-feedback-id" type="hidden" />
        <div class="field">
          <label for="sample-feedback-rating">Rating</label>
          <select id="sample-feedback-rating" required>
            <option value="">Select a rating</option>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Meets expectations</option>
            <option value="2">2 - Needs improvement</option>
            <option value="1">1 - Poor</option>
          </select>
        </div>
        <div class="field">
          <label for="sample-feedback-comment">Your feedback</label>
          <textarea id="sample-feedback-comment" rows="5" maxlength="1000" required placeholder="Tell the supplier about sample quality, packaging, or fit for your requirements."></textarea>
        </div>
        <div class="button-row">
          <button class="btn btn-secondary" id="cancel-sample-feedback" type="button">Cancel</button>
          <button class="btn btn-primary" type="submit">Submit feedback</button>
        </div>
      </form>
    </dialog>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

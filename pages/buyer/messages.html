<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Messages</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
</head>
  <body data-page="messages">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Messages & Negotiation</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <div class="form-grid">
            <div style="display: flex; flex-direction: column; gap: 12px">
              <h2>Conversations</h2>
              <form id="new-conversation-form" class="new-conversation-form">
                <label class="field-label" for="new-conversation-supplier">Start a conversation</label>
                <div class="new-conversation-controls">
                  <select id="new-conversation-supplier" class="form-control" required>
                    <option value="">Choose a supplier</option>
                  </select>
                  <button class="btn btn-secondary" type="submit">Start</button>
                </div>
              </form>
              <div id="conversation-list"></div>
            </div>
            <div>
              <h2>Conversation</h2>
              <div id="message-thread" class="message-thread"></div>
              <form id="message-form" style="margin-top: 20px">
                <div class="field">
                  <label for="message-input">Send message</label>
                  <textarea
                    id="message-input"
                    placeholder="Type your message..."
                  ></textarea>
                </div>
                <div class="button-row" style="margin-top: 12px">
                  <button class="btn btn-primary" type="submit">Send</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

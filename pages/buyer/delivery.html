<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeNest Buyer Delivery Tracking</title>
    <link rel="stylesheet" href="../../css/buyer/modules.css?v=buyer-nav-4" />
    <link rel="stylesheet" href="../../css/buyer/sidebar.css?v=buyer-nav-5" />
</head>
  <body data-page="delivery">
    <div class="module-shell">
      <aside class="buyer-sidebar" id="sidebar" data-buyer-sidebar></aside>
      <main class="module-main">
        <header class="module-header">
          <div class="module-header-title">
            <h1>Delivery Tracking</h1>
          </div>
          <button
            class="btn btn-secondary"
            type="button"
            id="reset-demo-data-btn"
          >
            Reset Local Data
          </button>
        </header>

        <section class="page-panel">
          <div id="shipment-list" class="record-grid"></div>
        </section>
        <dialog id="delivery-issue-dialog" class="sample-feedback-dialog" aria-labelledby="delivery-issue-title">
          <form id="delivery-issue-form">
            <h2 id="delivery-issue-title">Report a delivery issue</h2>
            <p>Describe the problem. Your report will be saved and sent to the supplier in Messages.</p>
            <input id="delivery-issue-shipment-id" type="hidden" />
            <div class="field">
              <label for="delivery-issue-type">Issue type</label>
              <select id="delivery-issue-type" required>
                <option value="Delay">Delivery is delayed</option>
                <option value="Damaged items">Items arrived damaged</option>
                <option value="Missing items">Items are missing</option>
                <option value="Wrong items">Wrong items received</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="delivery-issue-details">Details</label>
              <textarea id="delivery-issue-details" required maxlength="1000" placeholder="Add details to help the supplier resolve this..."></textarea>
            </div>
            <div class="button-row">
              <button class="btn btn-secondary" type="button" id="delivery-issue-cancel">Cancel</button>
              <button class="btn btn-primary" type="submit">Send to Supplier</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
    <script src="../../js/tradenest-store.js"></script>
    <script src="../../js/buyer/modules.js"></script>
    <script src="../../js/buyer/shared-sidebar.js?v=buyer-nav-4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comprehensive Supplier Dashboard E2E Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #faf9f5; color: #111; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    iframe { width: 100%; height: 800px; border: 1px solid #ccc; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Supplier Dashboard Verification Suite</h1>
  <div id="results">Running verification suite...</div>
  <iframe id="testFrame" src="../supplier-dashboard.html"></iframe>

  <script>
    const iframe = document.getElementById('testFrame');
    const results = document.getElementById('results');

    iframe.onload = () => {
      setTimeout(async () => {
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;
        const logs = [];

        function assert(cond, msg) {
          if (cond) {
            logs.push(`<div class="pass">✔ PASS: ${msg}</div>`);
          } else {
            logs.push(`<div class="fail">✘ FAIL: ${msg}</div>`);
          }
        }

        const wait = (ms) => new Promise(res => setTimeout(res, ms));

        try {
          // 1. Check Store initialized
          assert(!!win.SupplierStore, "SupplierStore exists on window");
          const products = win.SupplierStore.getProducts();
          assert(products.length >= 6, `Products retrieved from store: ${products.length}`);
          const rfqs = win.SupplierStore.getRFQs();
          assert(rfqs.length >= 4, `RFQs retrieved: ${rfqs.length}`);
          const quotes = win.SupplierStore.getQuotations();
          assert(quotes.length >= 3, `Quotations retrieved: ${quotes.length}`);
          const orders = win.SupplierStore.getOrders();
          assert(orders.length >= 4, `Orders retrieved: ${orders.length}`);

          // 2. Check INR Currency format
          const formatted = win.SupplierStore.formatINR(219400);
          assert(formatted === "₹2,19,400", `formatINR(219400) returned: ${formatted}`);

          // 3. Test Navigation Views
          const views = [
            'overview', 'products', 'inventory', 'rfqs', 'quotations', 
            'samples', 'orders', 'payments', 'shipping', 'collaboration', 
            'communication', 'performance', 'business-profile', 'settings'
          ];

          let navPassed = 0;
          for (const v of views) {
            const link = doc.getElementById(`nav-link-${v}`) || doc.querySelector(`.nav-link[data-view="${v}"]`);
            if (link) {
              link.click();
              await wait(30);
              const viewElem = doc.getElementById(`view-${v}`);
              if (viewElem && viewElem.classList.contains('active')) {
                navPassed++;
              }
            }
          }
          assert(navPassed === views.length, `All ${views.length} sidebar views clicked & activated (${navPassed}/${views.length})`);

          // Go back to overview
          const overviewLink = doc.getElementById('nav-link-overview');
          if (overviewLink) {
            overviewLink.click();
            await wait(30);
          }

          // 4. Test Quick Action Card Modals
          const addProductCard = doc.querySelector('.quick-action-card[data-action="add-product"]');
          assert(!!addProductCard, "Quick action card 'add-product' found");
          if (addProductCard) {
            addProductCard.click();
            await wait(120);
            const prodModal = doc.getElementById('productModal');
            assert(prodModal && !prodModal.hidden, "Product Modal opened when clicking 'Add New Product'");
            const closeBtn = doc.getElementById('closeProductModal');
            if (closeBtn) closeBtn.click();
            await wait(50);
            assert(prodModal && prodModal.hidden, "Product Modal closed properly");
          }

          const prepareQuoteCard = doc.querySelector('.quick-action-card[data-action="prepare-quote"]');
          assert(!!prepareQuoteCard, "Quick action card 'prepare-quote' found");
          if (prepareQuoteCard) {
            prepareQuoteCard.click();
            await wait(120);
            const quoteModal = doc.getElementById('quoteModal');
            assert(quoteModal && !quoteModal.hidden, "Quotation Modal opened when clicking 'Prepare Quotation'");
            const closeBtn = doc.getElementById('closeQuoteModal');
            if (closeBtn) closeBtn.click();
            await wait(50);
            assert(quoteModal && quoteModal.hidden, "Quotation Modal closed properly");
          }

          const updateStockCard = doc.querySelector('.quick-action-card[data-action="update-stock"]');
          assert(!!updateStockCard, "Quick action card 'update-stock' found");
          if (updateStockCard) {
            updateStockCard.click();
            await wait(120);
            const stockModal = doc.getElementById('stockModal');
            assert(stockModal && !stockModal.hidden, "Stock Modal opened when clicking 'Update Stock'");
            const closeBtn = doc.getElementById('closeStockModal');
            if (closeBtn) closeBtn.click();
            await wait(50);
            assert(stockModal && stockModal.hidden, "Stock Modal closed properly");
          }

          const dispatchCard = doc.querySelector('.quick-action-card[data-action="dispatch-shipment"]');
          assert(!!dispatchCard, "Quick action card 'dispatch-shipment' found");
          if (dispatchCard) {
            dispatchCard.click();
            await wait(120);
            const shipModal = doc.getElementById('shipmentModal');
            assert(shipModal && !shipModal.hidden, "Shipment Modal opened when clicking 'Dispatch Shipment'");
            const closeBtn = doc.getElementById('closeShipmentModal');
            if (closeBtn) closeBtn.click();
            await wait(50);
            assert(shipModal && shipModal.hidden, "Shipment Modal closed properly");
          }

          // 5. Test Orders Table rendering with INR
          const ordersLink = doc.getElementById('nav-link-orders');
          if (ordersLink) {
            ordersLink.click();
            await wait(50);
          }
          const orderRows = doc.querySelectorAll('#ordersTableBody tr');
          assert(orderRows.length >= 4, `Orders table rendered with ${orderRows.length} rows`);
          const firstOrderText = orderRows[0] ? orderRows[0].textContent : "";
          assert(firstOrderText.includes('₹'), `Order row includes ₹ currency`);
          assert(!firstOrderText.includes('$'), `Order row has no dollar signs`);

          // 6. Test Quotations Table rendering with INR
          const quotesLink = doc.getElementById('nav-link-quotations');
          if (quotesLink) {
            quotesLink.click();
            await wait(50);
          }
          const quoteRows = doc.querySelectorAll('#quotationsTableBody tr');
          assert(quoteRows.length >= 3, `Quotations table rendered with ${quoteRows.length} rows`);
          const firstQuoteText = quoteRows[0] ? quoteRows[0].textContent : "";
          assert(firstQuoteText.includes('₹'), `Quotation row includes ₹ currency`);
          assert(!firstQuoteText.includes('$'), `Quotation row has no dollar signs`);

          // 7. Check for console errors
          assert(true, "All suites executed without fatal error");

        } catch (err) {
          logs.push(`<div class="fail">Exception: ${err.message}\n${err.stack}</div>`);
        }

        results.innerHTML = `<h3>Results:</h3>` + logs.join('');
        document.title = logs.every(l => l.includes('pass')) ? "ALL TESTS PASSED" : "TESTS HAD FAILURES";
      }, 50);
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pages Supplier Dashboard E2E Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #faf9f5; color: #111; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    iframe { width: 100%; height: 800px; border: 1px solid #ccc; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Pages Supplier Dashboard Verification Suite</h1>
  <div id="results">Running verification suite...</div>
  <iframe id="testFrame" src="../pages/supplier/dashboard.html"></iframe>

  <script>
    const iframe = document.getElementById('testFrame');
    const results = document.getElementById('results');

    iframe.onload = () => {
      setTimeout(async () => {
        const doc = iframe.contentDocument;
        const win = iframe.contentWindow;
        const logs = [];

        function assert(cond, msg) {
          if (cond) {
            logs.push(`<div class="pass">✔ PASS: ${msg}</div>`);
          } else {
            logs.push(`<div class="fail">✘ FAIL: ${msg}</div>`);
          }
        }

        const wait = (ms) => new Promise(res => setTimeout(res, ms));

        try {
          // 1. Check Store initialized
          assert(!!win.SupplierStore, "SupplierStore exists on window");

          // 2. Test Navigation Views
          const views = [
            'overview', 'products', 'inventory', 'rfqs', 'quotations', 
            'samples', 'orders', 'payments', 'shipping', 'collaboration', 
            'communication', 'performance', 'business-profile', 'settings'
          ];

          let navPassed = 0;
          for (const v of views) {
            const link = doc.getElementById(`nav-link-${v}`) || doc.querySelector(`.nav-link[data-view="${v}"]`);
            if (link) {
              link.click();
              await wait(30);
              const viewElem = doc.getElementById(`view-${v}`);
              if (viewElem && viewElem.classList.contains('active')) {
                navPassed++;
              }
            }
          }
          assert(navPassed === views.length, `All ${views.length} sidebar views clicked & activated in pages/supplier/dashboard.html (${navPassed}/${views.length})`);

          // 3. Test Orders Table rendering with INR
          const ordersLink = doc.getElementById('nav-link-orders');
          if (ordersLink) {
            ordersLink.click();
            await wait(50);
          }
          const orderRows = doc.querySelectorAll('#ordersTableBody tr');
          assert(orderRows.length >= 4, `Orders table rendered with ${orderRows.length} rows`);
          const firstOrderText = orderRows[0] ? orderRows[0].textContent : "";
          assert(firstOrderText.includes('₹'), `Order row includes ₹ currency`);
          assert(!firstOrderText.includes('$'), `Order row has no dollar signs`);

          // 4. Test Quotations Table rendering with INR
          const quotesLink = doc.getElementById('nav-link-quotations');
          if (quotesLink) {
            quotesLink.click();
            await wait(50);
          }
          const quoteRows = doc.querySelectorAll('#quotationsTableBody tr');
          assert(quoteRows.length >= 3, `Quotations table rendered with ${quoteRows.length} rows`);
          const firstQuoteText = quoteRows[0] ? quoteRows[0].textContent : "";
          assert(firstQuoteText.includes('₹'), `Quotation row includes ₹ currency`);
          assert(!firstQuoteText.includes('$'), `Quotation row has no dollar signs`);

          assert(true, "All suites executed without fatal error");

        } catch (err) {
          logs.push(`<div class="fail">Exception: ${err.message}\n${err.stack}</div>`);
        }

        results.innerHTML = `<h3>Results:</h3>` + logs.join('');
        document.title = logs.every(l => l.includes('pass')) ? "ALL TESTS PASSED" : "TESTS HAD FAILURES";
      }, 50);
    };
  </script>
</body>
</html>
